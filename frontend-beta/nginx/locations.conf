# Site locations shared by the HTTP-only and the HTTPS server blocks
# (included from the config 40-clubspace-site.sh writes at container start).

root /usr/share/nginx/html;

# Server-Sent Events: no buffering or compression, long read timeout.
location = /api/v1/notifications/stream {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:3000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 75s;
}

location /api/ {
    # Event covers may be up to 5 MB (cover_service.js); nginx allows 1 MB by default.
    client_max_body_size 6m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:3000;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location / {
    try_files $uri $uri/ /index.html;
}
