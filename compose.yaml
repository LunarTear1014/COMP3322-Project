services:
  web:
    build: ./frontend-beta
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  backend:
    build: ./backend-beta
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: clubspace
      DB_USER: clubspace_app
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      SESSION_COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  db:
    image: mysql:8.4
    command:
      - --innodb-buffer-pool-size=128M
      - --innodb-use-native-aio=0
      - --max-connections=30
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: clubspace
      MYSQL_USER: clubspace_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
      - ./backend-beta/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend-beta/db/deployment-seed.sql:/docker-entrypoint-initdb.d/02-catalog.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1 FROM venues LIMIT 1' >/dev/null"]
      start_period: 45s
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  db_data:
